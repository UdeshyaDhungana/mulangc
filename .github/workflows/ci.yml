name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The native backend emits macOS arm64 assembly, and the program tests
    # assemble and run it with clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
